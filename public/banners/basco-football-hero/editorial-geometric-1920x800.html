<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, height=800" />
  <title>Basco Sports · Editorial Geometric</title>
  <style>
    :root { --ink:#0B1220; --lime:#D4FF32; --stone:#FCFBF9; --orange:#FF4D23; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:1920px; height:800px; overflow:hidden; }
    body { background:var(--stone); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    .banner { position:relative; width:1920px; height:800px; overflow:hidden; background:var(--stone); }
    .toprule { position:absolute; left:150px; right:150px; top:48px; border-top:2px solid var(--ink); padding-top:13px; display:flex; justify-content:space-between; text-transform:uppercase; letter-spacing:.18em; font-size:13px; font-weight:800; }
    .left { position:absolute; left:150px; top:145px; z-index:2; width:760px; }
    .eyebrow { color:var(--orange); text-transform:uppercase; font-weight:800; letter-spacing:.25em; font-size:17px; }
    h1 { margin:16px 0 0; font:900 108px/.84 Arial Black, Arial, sans-serif; letter-spacing:-.08em; text-transform:uppercase; }
    h1 span { display:block; color:var(--orange); }
    .copy { margin:28px 0 0; max-width:510px; color:rgba(11,18,32,.67); font-size:21px; line-height:1.45; }
    .cta { display:inline-flex; align-items:center; justify-content:center; margin-top:34px; min-width:190px; height:58px; padding:0 28px; border-radius:999px; background:var(--ink); color:#fff; text-decoration:none; font-size:17px; font-weight:800; }
    .cta:after { content:"↗"; color:var(--lime); margin-left:14px; font-size:22px; }
    .right { position:absolute; right:0; top:0; width:790px; height:800px; background:var(--ink); overflow:hidden; }
    .right:before { content:""; position:absolute; inset:0; background:linear-gradient(135deg, transparent 0 42%, rgba(212,255,50,.22) 42% 43%, transparent 43% 100%), repeating-linear-gradient(90deg, transparent 0 78px, rgba(255,255,255,.08) 79px 80px); }
    .circle { position:absolute; width:540px; height:540px; border:2px solid rgba(212,255,50,.8); border-radius:50%; right:35px; top:113px; }
    .circle:before, .circle:after { content:""; position:absolute; inset:64px; border:1px solid rgba(212,255,50,.35); border-radius:50%; }
    .circle:after { inset:128px; }
    .ball { position:absolute; width:218px; height:218px; border-radius:50%; right:190px; top:258px; background:var(--lime); transform:rotate(16deg); box-shadow:0 22px 44px rgba(0,0,0,.35); }
    .ball:after { content:""; position:absolute; left:67px; top:57px; width:76px; height:76px; background:var(--ink); clip-path:polygon(50% 0, 100% 35%, 81% 100%, 19% 100%, 0 35%); }
    .ball:before { content:""; position:absolute; left:104px; top:20px; width:4px; height:178px; background:var(--ink); transform:rotate(-23deg); opacity:.85; }
    .side { position:absolute; right:42px; top:92px; color:var(--lime); font-size:12px; text-transform:uppercase; letter-spacing:.2em; writing-mode:vertical-rl; }
    .big { position:absolute; right:47px; bottom:-28px; color:transparent; -webkit-text-stroke:1px rgba(212,255,50,.55); font:900 260px/.8 Arial Black,Arial,sans-serif; letter-spacing:-.12em; }
    .brand { position:absolute; z-index:4; left:150px; top:48px; transform:translateY(-1px); display:flex; align-items:center; gap:13px; text-transform:uppercase; font-size:15px; font-weight:800; letter-spacing:.2em; }
    .mark { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:var(--ink); }
    .mark svg { width:30px; height:30px; }
    .footer { position:absolute; left:150px; bottom:40px; display:flex; align-items:center; gap:18px; color:rgba(11,18,32,.5); font-size:12px; text-transform:uppercase; letter-spacing:.15em; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--orange); }
  </style>
</head>
<body>
  <main class="banner">
    <div class="toprule"><span>Football study / 01</span><span>Performance objects · Basco sports</span></div>
    <div class="brand"><span class="mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#D4FF32"/><path d="m20 10.2 6.1 4.5-2.3 7.1h-7.6l-2.3-7.1L20 10.2Z" fill="#0B1220"/><path d="M20 10.2V5.4M13.9 14.7 8 17M26.1 14.7 32 17M16.2 21.8l-3.7 6M23.8 21.8l3.7 6" stroke="#0B1220" stroke-width="1.5" stroke-linecap="round"/></svg></span><span>Basco Sports</span></div>
    <section class="left">
      <div class="eyebrow">The football edit</div>
      <h1>Made for<br><span>the moment.</span></h1>
      <p class="copy">Precision boots, match balls and training essentials for players who notice the details.</p>
      <a class="cta" href="/category/football">Shop football</a>
    </section>
    <section class="right"><div class="circle"></div><div class="ball"></div><div class="side">Basco / Football / 2026</div><div class="big">01</div></section>
    <div class="footer"><span class="dot"></span><span>Built for the beautiful game</span></div>
  </main>
</body>
</html>
