<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, height=800" />
  <title>Basco Sports · Photo-Based</title>
  <style>
    * { box-sizing:border-box; }
    html, body { margin:0; width:1920px; height:800px; overflow:hidden; }
    body { background:#0B1220; color:white; font-family:Arial, Helvetica, sans-serif; }
    .banner { position:relative; width:1920px; height:800px; overflow:hidden; background:#0B1220; }
    .photo { position:absolute; inset:0; background-image:url('https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?q=85&w=2400&auto=format&fit=crop'); background-size:cover; background-position:center 44%; filter:saturate(.86) contrast(1.08); }
    .photo:after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(11,18,32,.96) 0%, rgba(11,18,32,.78) 29%, rgba(11,18,32,.2) 64%, rgba(11,18,32,.14) 100%),linear-gradient(0deg, rgba(11,18,32,.7), transparent 45%); }
    .content { position:absolute; z-index:2; left:150px; top:112px; width:720px; }
    .topline { display:flex; align-items:center; justify-content:space-between; width:1620px; color:rgba(255,255,255,.8); text-transform:uppercase; font-weight:800; letter-spacing:.2em; font-size:16px; }
    .brand { display:flex; align-items:center; gap:14px; }
    .mark { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; background:#D4FF32; }
    .mark svg { width:34px; height:34px; }
    .season { color:#D4FF32; }
    .eyebrow { margin-top:135px; color:#D4FF32; text-transform:uppercase; font-size:17px; font-weight:800; letter-spacing:.24em; }
    h1 { margin:18px 0 0; font:900 100px/.88 Arial Black, Arial, sans-serif; letter-spacing:-.075em; text-transform:uppercase; }
    h1 span { display:block; color:#D4FF32; }
    .copy { max-width:500px; margin:28px 0 0; color:rgba(255,255,255,.78); font-size:22px; line-height:1.42; }
    .cta { display:inline-flex; align-items:center; justify-content:center; margin-top:38px; min-width:190px; height:58px; padding:0 28px; border-radius:999px; background:#D4FF32; color:#0B1220; text-decoration:none; font-size:17px; font-weight:800; }
    .cta:after { content:"↗"; margin-left:14px; font-size:22px; }
    .badge { position:absolute; z-index:2; right:150px; bottom:72px; width:200px; height:200px; border:1px solid rgba(212,255,50,.7); border-radius:50%; display:grid; place-items:center; color:#D4FF32; text-align:center; text-transform:uppercase; letter-spacing:.15em; font-size:12px; line-height:1.6; transform:rotate(-12deg); }
    .badge strong { display:block; font-size:36px; line-height:1; letter-spacing:-.05em; }
    .rule { position:absolute; z-index:3; left:150px; right:150px; bottom:40px; border-top:1px solid rgba(255,255,255,.25); padding-top:14px; display:flex; justify-content:space-between; color:rgba(255,255,255,.56); text-transform:uppercase; letter-spacing:.15em; font-size:12px; }
  </style>
</head>
<body>
  <main class="banner">
    <div class="photo"></div>
    <div class="content">
      <div class="topline"><div class="brand"><span class="mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#0B1220"/><path d="m20 10.2 6.1 4.5-2.3 7.1h-7.6l-2.3-7.1L20 10.2Z" fill="#D4FF32"/><path d="M20 10.2V5.4M13.9 14.7 8 17M26.1 14.7 32 17M16.2 21.8l-3.7 6M23.8 21.8l3.7 6" stroke="#D4FF32" stroke-width="1.5" stroke-linecap="round"/></svg></span><span>Basco Sports</span></div><span class="season">New season 24/25</span></div>
      <div class="eyebrow">Football / Made to move</div>
      <h1>Own<br><span>the pitch.</span></h1>
      <p class="copy">Premium football gear with the fit, grip and control to make every touch count.</p>
      <a class="cta" href="/category/football">Shop football</a>
    </div>
    <div class="badge"><div><strong>90</strong>minutes<br>of intent</div></div>
    <div class="rule"><span>Tracked worldwide delivery</span><span>Basco Football / 2026</span></div>
  </main>
</body>
</html>
