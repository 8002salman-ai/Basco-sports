<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, height=800" />
  <title>Basco Sports · Bold Athletic</title>
  <style>
    :root { --ink:#0B1220; --lime:#D4FF32; --stone:#FCFBF9; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:1920px; height:800px; overflow:hidden; }
    body { background:var(--ink); color:white; font-family:Arial, Helvetica, sans-serif; }
    .banner { position:relative; width:1920px; height:800px; overflow:hidden; background:var(--ink); }
    .grid { position:absolute; inset:0; opacity:.13; background-image:linear-gradient(90deg, transparent 0 79px, #fff 80px),linear-gradient(0deg, transparent 0 79px, #fff 80px); background-size:80px 80px; }
    .glow { position:absolute; width:900px; height:900px; right:-180px; top:-280px; border-radius:50%; background:var(--lime); opacity:.96; }
    .glow:after { content:""; position:absolute; inset:110px; border:2px solid var(--ink); border-radius:50%; opacity:.2; }
    .stripe { position:absolute; right:420px; top:-100px; width:250px; height:1050px; transform:rotate(24deg); background:rgba(212,255,50,.14); }
    .stripe.two { right:170px; opacity:.55; }
    .content { position:absolute; z-index:2; left:150px; top:112px; width:850px; }
    .brand { display:flex; align-items:center; gap:16px; text-transform:uppercase; font-size:18px; font-weight:800; letter-spacing:.2em; }
    .mark { width:54px; height:54px; border-radius:16px; background:var(--lime); display:grid; place-items:center; }
    .mark svg { width:38px; height:38px; }
    .eyebrow { margin-top:82px; color:var(--lime); text-transform:uppercase; font-size:18px; font-weight:800; letter-spacing:.24em; }
    h1 { margin:16px 0 0; font:900 104px/.86 Arial Black, Arial, sans-serif; letter-spacing:-.075em; text-transform:uppercase; }
    h1 span { color:var(--lime); display:block; }
    .copy { margin:28px 0 0; max-width:520px; color:rgba(255,255,255,.68); font-size:22px; line-height:1.4; }
    .cta { display:inline-flex; align-items:center; justify-content:center; margin-top:36px; min-width:190px; height:58px; padding:0 28px; border-radius:999px; background:var(--lime); color:var(--ink); text-decoration:none; font-size:17px; font-weight:800; }
    .cta:after { content:"↗"; margin-left:14px; font-size:22px; }
    .ball { position:absolute; z-index:3; right:230px; bottom:118px; width:340px; height:340px; border-radius:50%; background:#f8f7f4; box-shadow:0 24px 50px rgba(0,0,0,.3); transform:rotate(-12deg); }
    .ball:before { content:""; position:absolute; inset:31px; border:5px solid var(--ink); border-radius:50%; opacity:.14; }
    .ball:after { content:""; position:absolute; left:112px; top:92px; width:88px; height:88px; background:var(--ink); clip-path:polygon(50% 0, 100% 35%, 81% 100%, 19% 100%, 0 35%); box-shadow:0 0 0 18px transparent; }
    .seam { position:absolute; left:166px; top:64px; width:6px; height:214px; background:var(--ink); transform:rotate(-24deg); opacity:.9; }
    .seam.s2 { left:75px; top:146px; width:210px; height:6px; transform:rotate(18deg); }
    .seam.s3 { left:184px; top:138px; width:6px; height:205px; transform:rotate(57deg); }
    .number { position:absolute; right:90px; top:74px; z-index:2; color:var(--ink); font:900 220px/.8 Arial Black,Arial,sans-serif; letter-spacing:-.12em; opacity:.13; }
    .rule { position:absolute; z-index:4; bottom:42px; left:150px; right:150px; display:flex; justify-content:space-between; color:rgba(255,255,255,.42); text-transform:uppercase; letter-spacing:.16em; font-size:13px; }
  </style>
</head>
<body>
  <main class="banner">
    <div class="grid"></div><div class="glow"></div><div class="stripe"></div><div class="stripe two"></div><div class="number">90</div>
    <div class="content">
      <div class="brand"><span class="mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#0B1220"/><path d="m20 10.2 6.1 4.5-2.3 7.1h-7.6l-2.3-7.1L20 10.2Z" fill="#D4FF32"/><path d="M20 10.2V5.4M13.9 14.7 8 17M26.1 14.7 32 17M16.2 21.8l-3.7 6M23.8 21.8l3.7 6" stroke="#D4FF32" stroke-width="1.5" stroke-linecap="round"/></svg></span><span>Basco Sports</span></div>
      <div class="eyebrow">Football / 2026 edit</div>
      <h1>Built for<br><span>the beautiful game.</span></h1>
      <p class="copy">Match-ready boots, kits and essentials for the moments that move the game forward.</p>
      <a class="cta" href="/category/football">Shop football</a>
    </div>
    <div class="ball"><div class="seam"></div><div class="seam s2"></div><div class="seam s3"></div></div>
    <div class="rule"><span>Performance / Fit / Craft</span><span>Basco Football Co.</span></div>
  </main>
</body>
</html>
